name: coffee-interpreter-feasibility
services:
  interpreter:
    image: "${COFFEE_INTERPRETER_IMAGE:?Set the inspected local runtime image ID}"
    pull_policy: never
    user: "${COFFEE_RUN_UID:?Set nonzero host UID}:${COFFEE_RUN_GID:?Set host GID}"
    entrypoint: []
    command: ["python", "/opt/experiment/run.py"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    cpus: 2
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 64
    restart: "no"
    stop_grace_period: 10s
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      TRANSFORMERS_OFFLINE: "1"
    working_dir: /results
    volumes:
      - type: bind
        source: ../../data/local-interpreter/model
        target: /model
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../data/local-interpreter/requests
        target: /requests
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../runs/local-interpreter
        target: /results
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
